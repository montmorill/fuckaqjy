<script>
var path = '/ept';
var $account = $('input[name=username]'),
	$password = $('#password'),
	$password_real = $('#realPassword'),
	$kaptcha = $('input[name=kaptcha_login]'),
	$kaptcha_image = $('#kaptchaImage'),
	$error = $('.error');
var isShowTabSSO = false;	//是否显示统一认证登录窗口，需要时，直接改为true即可
$(document).ready(function(){
	//验证码处理
	$kaptcha_image.click(function(){
		$kaptcha.val('');
	   	$error.text('');
	   	$(this).fadeOut({duration:500})
	   	  	.attr('src', contextPath+'/login/captcha/?' + Math.floor(Math.random()*10000000000) )
	  		.fadeIn({duration:2000}); 
	});
	$kaptcha.change(function(){
		$error.text('');
	});
	//背景图片自动轮播
    var i_mun = 0;
    var num = $(".lunbo-list").length;
    var t = setInterval(function move() {
        if(i_mun == num - 1){
            i_mun = -1
        }
        $(".lunbo-list").eq(i_mun + 1).css('z-index','1').siblings('.lunbo-list').css('z-index','-1');
        i_mun++;
    }, 6000);
    
	//轮询刷新当前在线人数
	/*
	onlineUser();
	setInterval(onlineUser, 60000);
	*/
	
	//查询通知公告、规章制度
	getNotice(0, $('.list-notice-0'));
	getNotice(1, $('.list-notice-1'));
	
	//是否显示统一认证登录窗口
	if(isShowTabSSO) {
		$('.tabTit h1').click(function(){
			var rel = $(this).attr('rel');
			toggleTab(rel);
		});
		toggleTab('sso');

	else {
		$('.tabTit h1[rel=sso]').remove();
		$('.tabBox[rel=sso]').remove();

	}
});
function submitLoginForm(form){
//  $.ajax({url:'../vlabIntegration/login', type: "POST", data: {account:$('input[name=username]').val()}, async:false});
	//在线人数限制
	var maxActive = 2000;
	var excludeAccount =
		['admin@test.com', '994408', '309942', '996246', '996038', '996259', '995712', '994402', '995893', '996152',
		'990751001', '996490', '994539', '996019', '992928', '991854', '20201001', '3625', '995677', '992372',
		'994653', '994409', '991860', '995048', '994003', '994004', '993870', '993621', '992940', '992817',
		'992481', '992076'];
	var flag = true;
	if ($account && $.inArray($account.val(), excludeAccount) == -1) {
		$.ajax({
			url: path + '/manage/sessionRecord/online',
			type: 'POST',
			dataType: 'JSON',
			async: false,
			success: function (data) {
				if (data.data.online >= maxActive) {
					$error.text('当前在线人数过多，请稍后再试!');
					flag = false;
				}
			},
			error: function (xhr, textStatus, errorThrown) {
				$error.text('当前在线人数过多，请稍后再试!');
				flag = false;
			}
		});
	}
	if (!flag) {
		return false;
	}
	var password = $password.val();
	if(password){
		if(password.length > 50) {
			$error.text('密码不能超过50个字符!');
			return false;
		}
		var passwdEncrypt = new PasswdEncrypt('83a1bbb97c661d1222cc253d3fafed3032cb7ace4b6e5fb01d2379542cee99dffc9015c4c1bd54418c17790c40b5b5cb86bb5fb190f2faa59cdff4a2fce8e19cee6643b24e5871c2e29fa86f91a6c0864d70165c8224f20d670f6540f4b049f049ce700fc6ee2abe1b0928034584ce5f1ce4c2afb6020ec64ee5a93de81fe4e5b2e1937e05ad50e99815f82fa951254f8fe9eb50b20e6a62e9b72f984037740738062702f1e35ee3873ed9ef25c85d57cb2dbc30bc83a44961daff03a6d8e7a0a91afd853e53784f79ebc8b4ed55e0b9eb2e4c260d0e8be6548957b671519d747bb3e993c93ddf2155e8fe1bcf4bbf4a64d651a7084643a435092d445a5805e1','10001');
		var pwd = passwdEncrypt.encrypt(password, '.wP7YpW.SaNhy08rltwFIKEa_qMx_66cSlZeSHBeT0UuVXf50s');
		$password_real.val(pwd);
	}
	return true;
}
function onlineUser() {
	ajax(path + '/manage/sessionRecord/online', null, function(result) {
		var online = 0;
		if(result.statusCode == 200) {
			online = result.data.online;
		}
		$('.online-user span').text(online);
	});
}
function getNotice(type, $list) {
	ajax(path + '/manage/notice/find/list', {type: type}, function(result) {
		$list.empty();
		if(result.statusCode == 200) {
			var notices = result.data.notices;
			if(notices.length == 0) {
				$list.append('<p class="placeholder">暂无发布内容~</p>');
			}
			else {
				var $ul = $('<ul></ul>').appendTo($list);
				var count = 0;
				for(var i=0; i<notices.length; i++) {
					if(count > 4) {
						break;
					}
					$ul.append('<li><a href="' + path + '/manage/notice/find/view?id=' + notices[i].id + '" target="_blank">' + notices[i].title + '</a></li>');
					count++;
				}
			}
		}
		else {
			$list.append('<p class="placeholder">获取内容出错！</p>');
		}
	});
}
/*安全标识轮播*/
var oul = $('.swiper ul'),
 	oli = oul.find('li'),
 	group = 0,
 	timer,
 	olinum = oli.length;
move();
if(oli.length>=9){
	oul.append(oli.clone());
}
oul.width(3*oli.length*oli.width())
function move(){
	if(oli.length>=9){
		timer = setInterval(function(){
			group = group+0.5;
			if(group>=olinum*(oli.width()+50)){
				group = 0;
			}
			oul.animate({'left':-group+'px'},10,'linear')
		},10)
	}
}
$('.swiper').hover(function(){
	clearInterval(timer);
},function(){
    move();
});

function toggleTab(rel) {
	$('.tabBox').hide();
	$('.tabBox[rel=' + rel + ']').show();
	$('.tabTit h1').removeClass('active');
	$('.tabTit h1[rel=' + rel + ']').addClass('active');
}
